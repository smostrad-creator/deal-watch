name: 降價追蹤

on:
  schedule:
    # 每天早上 8 點、晚上 8 點檢查（台灣時間；這裡寫的是 UTC，所以是 0 點和 12 點）
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      track_id:
        description: "只檢查這一條（查詢頁新增追蹤時自動填，不用自己填）"
        required: false
        default: ""
      sale:
        description: "特價開賣後加查（特價快報自動填，不用自己填）"
        required: false
        default: ""
      op:
        description: "新增或刪除追蹤（查詢頁自動填，不用自己填）"
        required: false
        default: ""
      data:
        description: "追蹤資料（查詢頁自動填，不用自己填）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝工具
        run: pip install faster-flights openpyxl

      - name: 檢查價格
        env:
          TRACK_ID: ${{ inputs.track_id }}
          SALE: ${{ inputs.sale }}
          TRACK_OP: ${{ inputs.op }}
          TRACK_DATA: ${{ inputs.data }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python track_job.py

      - name: 存追蹤狀態
        run: |
          git config user.name "price-track-bot"
          git config user.email "price-track-bot@users.noreply.github.com"
          git add track_state.json tracks.json
          git diff --cached --quiet && exit 0
          git commit -m "更新追蹤狀態"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
