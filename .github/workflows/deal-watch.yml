name: 特價快報

on:
  schedule:
    # 每 30 分鐘執行一次：每次都檢查「開搶提醒」，每 2 小時才搜尋一次新聞
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "只傳一則測試訊息"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: deal-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 搜尋促銷消息
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python deal_watch.py --test
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              python deal_watch.py --search
            else
              python deal_watch.py
            fi
          fi

      - name: 記住已通知過的消息
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "deal-watch-bot"
          git config user.email "deal-watch-bot@users.noreply.github.com"
          git add seen.json reminders.json
          git diff --cached --quiet && exit 0
          git commit -m "更新已通知清單"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
