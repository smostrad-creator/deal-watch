<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易日記</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; background:#f5f5f3; color:#0b0b0b; margin:0; padding:16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  input, select, textarea, button { font-family: inherit; font-size: 13px; }
  input, select, textarea { width:100%; box-sizing:border-box; background:#fff; border:1px solid #d8d6cf; border-radius:8px; padding:8px 10px; color:#0b0b0b; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#888780; }
  button { background:transparent; border:1px solid #c3c2b7; border-radius:8px; padding:8px 14px; cursor:pointer; color:#0b0b0b; }
  button:hover { background:#efeee9; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-primary { background:#0b0b0b; color:#fff; border:none; }
  .btn-primary:hover { background:#2c2c2a; }
  .label { font-size:11px; color:#898781; display:block; margin-bottom:4px; }
  .card { background:#fcfcfb; border-radius:12px; border:1px solid #e1e0d9; padding:1rem 1.25rem; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; position:relative; }
  .header-left { display:flex; align-items:center; gap:10px; }
  h1 { font-size:18px; font-weight:600; margin:0; }
  h2 { font-size:15px; font-weight:600; margin:0; }
  .metric-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-bottom:1.25rem; }
  .metric { background:#fcfcfb; border-radius:8px; padding:1rem; border:1px solid #e1e0d9; }
  .metric-label { font-size:12px; color:#898781; margin-bottom:4px; }
  .metric-value { font-size:18px; font-weight:600; white-space:nowrap; }
  .trade-card { background:#fcfcfb; border-radius:12px; border:1px solid #e1e0d9; padding:12px 14px; margin-bottom:8px; }
  .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px; }
  .full { grid-column: 1 / 3; }
  .acc-menu { display:none; position:absolute; top:calc(100% + 6px); left:0; width:220px; z-index:10; background:#fff; border:1px solid #e1e0d9; border-radius:12px; padding:6px; max-height:280px; overflow-y:auto; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
  .acc-menu.show { display:block; }
  .acc-item { display:block; width:100%; text-align:left; background:transparent; border:none; border-radius:8px; padding:8px 10px; cursor:pointer; }
  .acc-item:hover { background:#f0efe9; }
  .warning-box { display:none; align-items:flex-start; gap:8px; background:#faeeda; border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  .warning-box.show { display:flex; }
  .pair-options { display:none; position:absolute; top:100%; left:0; right:0; z-index:20; background:#fff; border:1px solid #e1e0d9; border-radius:8px; margin-top:4px; max-height:180px; overflow-y:auto; box-shadow:0 4px 16px rgba(0,0,0,0.08); }
  .pair-options.show { display:block; }
  .pair-item { padding:7px 10px; font-size:13px; cursor:pointer; }
  .pair-item:hover { background:#f0efe9; }
  img.thumb { width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid #e1e0d9; cursor:pointer; }
  #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:300; align-items:center; justify-content:center; padding:20px; }
  #lightbox img { max-width:100%; max-height:85vh; border-radius:8px; cursor:pointer; }
  .lb-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.15); border:none; color:#fff; width:44px; height:44px; border-radius:50%; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lb-nav:hover { background:rgba(255,255,255,0.3); }
  #lbPrev { left:12px; }
  #lbNext { right:12px; }
  #lbCounter { position:absolute; top:16px; left:50%; transform:translateX(-50%); color:#fff; font-size:13px; background:rgba(0,0,0,0.4); padding:4px 12px; border-radius:12px; }
  #lbClose { position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.15); border:none; color:#fff; width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; }
  .empty-state { background:#fcfcfb; border-radius:12px; padding:2.5rem 1.5rem; text-align:center; border:1px solid #e1e0d9; }
  .risk-auto { display:none; background:#f0efe9; border-radius:8px; padding:8px 10px; font-size:12px; color:#52514e; }
  .batch-row { display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid #e1e0d9; font-size:14px; }
  .batch-row input[type=checkbox] { width:15px; height:15px; flex-shrink:0; accent-color:#0b0b0b; margin:0; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-grid-header { margin-bottom:6px; }
  .cal-weekday { text-align:center; font-size:11px; color:#898781; padding:4px 0; }
  .cal-cell { border:1px solid #e1e0d9; border-radius:8px; padding:6px 4px; min-height:56px; }
  .cal-cell-empty { border:none; background:transparent; }
  #diaryNoteInput:empty:before { content: attr(data-placeholder); color: #b8b6ad; }
  #diaryNoteInput img { max-width:100%; max-height:360px; border-radius:8px; display:block; margin:10px 0; cursor:pointer; }
  #diaryNoteInput:focus { outline:none; border-color:#888780; }
  #diaryNoteInput { transition: max-height 0.2s ease; }
  .auth-error { display:none; background:#fbe4e2; color:#a02c22; border-radius:8px; padding:10px 12px; font-size:12px; margin-bottom:12px; }
  .auth-error.show { display:block; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation: spin 0.7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<script>

const SUPABASE_URL = 'https://mayncajgsbejozqypbtk.supabase.co';

let currentUser = null;
let accounts = [];
let activeId = null;
let editingTradeId = null;
let activeView = 'chart'; // 'chart' | 'calendar' | 'pie'
let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let selectedDateStart = null; // 'YYYY-MM-DD' 或 null(未篩選)
let selectedDateEnd = null;

let diarySelectedTradeId = null;

let selectedPair = pairList[0];

function uid(){ return Math.random().toString(36).slice(2,9); }
function fmtMoney(n){ n = Number(n)||0; const s = n<0?'-':''; return s+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function totalPnlOf(t){ return Number(t.pnl)||0; } // 損益本身已含庫存費,不再額外加總
function netTradingPnl(t){ return (Number(t.pnl)||0) - (Number(t.storageFee)||0); } // 扣掉庫存費後的純交易損益,給風控計算用
function nowPlatformStr(){
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
function parsePlatformDate(p){
  if(!p) return null;
  p = p.trim();
  const m = p.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})[ T]?(\d{1,2})?:?(\d{1,2})?:?(\d{1,2})?/);
  if(!m) return null;
  const [, y, mo, day, h, mi, s] = m;
  const d = new Date(Number(y), Number(mo)-1, Number(day), Number(h||0), Number(mi||0), Number(s||0));
  return isNaN(d.getTime()) ? null : d;
}
function taiwanTime(p){
  const d = parsePlatformDate(p);
  if(!d) return '';
  d.setHours(d.getHours()+5);
  const pad = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

function formatHoldingDuration(openStr, closeStr){
  const o = parsePlatformDate(openStr);
  const c = parsePlatformDate(closeStr);
  if(!o || !c) return null;
  const diffMs = c - o;
  if(diffMs < 0) return null;
  const totalMin = Math.floor(diffMs / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  const parts = [];
  if(days > 0) parts.push(days + '天');
  if(days > 0 || hours > 0) parts.push(hours + '小時');
  parts.push(mins + '分');
  return parts.join('');
}

function dateKeyOf(platformTimeStr){
  const d = parsePlatformDate(platformTimeStr);
  if(!d) return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function checkLogicWarning(direction, entry, exit, pnl){
  const e = Number(entry), x = Number(exit), p = Number(pnl);
  if(isNaN(e) || isNaN(x) || isNaN(p) || e===x) return '';
  const priceWentUp = x > e;
  const expectProfit = direction === 'buy' ? priceWentUp : !priceWentUp;
  if(expectProfit && p < 0){
    return direction==='buy' ? '做多、出場價高於進場價,價格上漲,但損益卻填負數,請確認。' : '做空、出場價低於進場價,價格下跌,但損益卻填負數,請確認。';
  }
  if(!expectProfit && p > 0){
    return direction==='buy' ? '做多、出場價低於進場價,價格下跌,但損益卻填正數,請確認。' : '做空、出場價高於進場價,價格上漲,但損益卻填正數,請確認。';
  }
  return '';
}

function balanceBeforeTrade(acc, excludeId, platformTimeStr){
  const targetDate = parsePlatformDate(platformTimeStr);
  const others = acc.trades.filter(t => t.id !== excludeId).map(t => ({ ...t, _d: parsePlatformDate(t.platformTime) }));
  if(!targetDate){
    const total = others.reduce((s,t)=>s+totalPnlOf(t),0);
    return acc.initialCapital + total;
  }
  const before = others.filter(t => t._d && t._d < targetDate);
  const total = before.reduce((s,t)=>s+totalPnlOf(t),0);
  return acc.initialCapital + total;
}

function parseBatchText(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  const records = [];
  let i = 0;
  const numRe = /^-?[\d,]+\.?\d*$/;
  const arrowRe = /^(-?[\d,]+\.?\d*)\s*(?:→|->|~)\s*(-?[\d,]+\.?\d*)/;
  const dateRe = /^(\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}\s+\d{1,2}:\d{1,2}:\d{1,2})/;
  const dirRe = /^(buy|sell)$/i;
  const pairRe = /^(?=.*[A-Z])[A-Z0-9]{3,10}$/i;

  while(i < lines.length){
    let pair = null, direction = null, lots = null, pnl = null;
    const combined = lines[i].match(/^([A-Z0-9]{3,10})\s+(buy|sell)\s+([\d.]+)\s*(-?[\d,]+\.?\d*)?$/i);
    if(combined){
      pair = combined[1].toUpperCase(); direction = combined[2].toLowerCase(); lots = combined[3];
      pnl = combined[4] ? combined[4].replace(/,/g,'') : null;
      i++;
    } else if(pairRe.test(lines[i]) && !numRe.test(lines[i]) && !dateRe.test(lines[i]) && !dirRe.test(lines[i]) && lines[i+1] && dirRe.test(lines[i+1])){
      pair = lines[i].toUpperCase(); direction = lines[i+1].toLowerCase(); i += 2;
    } else { i++; continue; }

    let numbers = []; let arrow = null; let dates = [];
    while(i < lines.length){
      const dm = lines[i].match(dateRe);
      if(dm){ dates.push(dm[1]); i++; continue; }
      const am = lines[i].match(arrowRe);
      if(am){ arrow = [am[1].replace(/,/g,''), am[2].replace(/,/g,'')]; i++; continue; }
      if(numRe.test(lines[i].replace(/,/g,''))){ numbers.push(lines[i].replace(/,/g,'')); i++; continue; }
      break;
    }
    // 一個日期時,視為平倉時間(向下相容原本格式);兩個日期時,第一個是開倉、第二個是平倉
    let openTime = '', platformTime = '';
    if(dates.length >= 2){ openTime = dates[0]; platformTime = dates[1]; }
    else if(dates.length === 1){ platformTime = dates[0]; }
    let entry = '', exit = '';
    if(arrow){
      entry = arrow[0]; exit = arrow[1];
      if(pnl === null && numbers.length >= 1) pnl = numbers[numbers.length-1];
    } else if(numbers.length === 4){
      entry = numbers[0]; exit = numbers[1];
      if(lots === null) lots = numbers[2];
      if(pnl === null) pnl = numbers[3];
    } else if(numbers.length === 3){
      entry = numbers[0]; exit = numbers[1];
      if(pnl === null) pnl = numbers[2];
    } else if(numbers.length === 2 && lots !== null){
      entry = numbers[0]; exit = numbers[1];
    }
    records.push({ pair, direction, lots: lots||'', entry, exit, pnl: pnl||'', openTime, platformTime, include: true });
  }
  return records;
}

// ====== 認證 ======
let authMode = 'login'; // 'login' | 'signup' | 'forgot'

function showAuthError(msg){
  const box = document.getElementById('authError');
  box.textContent = msg;
  box.classList.add('show');
}
function clearAuthError(){
  document.getElementById('authError').classList.remove('show');
}
function applyAuthMode(){
  clearAuthError();
  document.getElementById('confirmNotice').style.display = 'none';
  document.getElementById('resetSentNotice').style.display = 'none';
  const pwWrap = document.getElementById('passwordFieldWrap');
  const extraLinks = document.getElementById('loginExtraLinks');
  if(authMode === 'forgot'){
    pwWrap.style.display = 'none';
    extraLinks.style.display = 'none';
    document.getElementById('loginBtn').textContent = '寄送重設密碼信';
    document.getElementById('signupLink').textContent = '改為登入';
    document.getElementById('authSubtitle').textContent = '輸入註冊時的 email,寄送重設密碼連結';
  } else if(authMode === 'signup'){
    pwWrap.style.display = 'block';
    extraLinks.style.display = 'block';
    document.getElementById('loginBtn').textContent = '註冊';
    document.getElementById('signupLink').textContent = '改為登入';
    document.getElementById('authSubtitle').textContent = '建立新帳號';
  } else {
    pwWrap.style.display = 'block';
    extraLinks.style.display = 'block';
    document.getElementById('loginBtn').textContent = '登入';
    document.getElementById('signupLink').textContent = '註冊';
    document.getElementById('authSubtitle').textContent = '登入後開始記錄你的交易';
  }
}

document.getElementById('signupLink').onclick = (e) => {
  e.preventDefault();
  authMode = (authMode === 'signup') ? 'login' : 'signup';
  applyAuthMode();
};
document.getElementById('forgotLink').onclick = (e) => {
  e.preventDefault();
  authMode = 'forgot';
  applyAuthMode();
};

document.getElementById('loginBtn').onclick = async () => {
  clearAuthError();
  document.getElementById('confirmNotice').style.display = 'none';
  document.getElementById('resetSentNotice').style.display = 'none';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if(authMode === 'forgot'){
    if(!email){ showAuthError('請輸入 email。'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>處理中';
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
    btn.disabled = false; btn.textContent = originalText;
    if(error){ showAuthError(error.message); return; }
    document.getElementById('resetSentNotice').style.display = 'block';
    return;
  }

  if(!email || !password){ showAuthError('請輸入 email 和密碼。'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>處理中';

  if(authMode === 'signup'){
    const { data, error } = await sb.auth.signUp({ email, password });
    btn.disabled = false; btn.textContent = originalText;
    if(error){ showAuthError(error.message); return; }
    document.getElementById('confirmNotice').style.display = 'block';
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = originalText;
    if(error){ showAuthError(error.message); return; }
    await enterApp();
  }
};

async function loadAccountsFromDb(){
  const { data: accData, error: accErr } = await sb
    .from('accounts')
    .select('*')
    .order('created_at', { ascending: false });
  if(accErr){ alert('讀取帳戶失敗:' + accErr.message); return; }

  const { data: tradeData, error: tradeErr } = await sb
    .from('trades')
    .select('*');
  if(tradeErr){ alert('讀取交易紀錄失敗:' + tradeErr.message); return; }

  accounts = (accData||[]).map(a => ({
    id: a.id,
    name: a.name,
    initialCapital: Number(a.initial_capital),
    trades: (tradeData||[]).filter(t => t.account_id === a.id).map(t => ({
      id: t.id,
      pair: t.pair, direction: t.direction, entry: t.entry, exit: t.exit,
      lots: t.lots, pnl: t.pnl, storageFee: t.storage_fee, riskPercent: t.risk_percent,
      openTime: t.open_time, platformTime: t.platform_time, note: t.note, images: t.images || []
    }))
  }));
  accounts.forEach(a=>a.trades.forEach(t=>{ if(t.pair && !pairList.includes(t.pair)) pairList.push(t.pair); }));
  if(!activeId && accounts.length>0) activeId = accounts[0].id;
}

async function uploadImages(files){
  const urls = [];
  for(const file of files){
    const ext = (file.name && file.name.split('.').pop()) || 'png';
    const path = currentUser.id + '/' + uid() + '.' + ext;
    const { error } = await sb.storage.from(IMAGE_BUCKET).upload(path, file);
    if(error){ alert('圖片上傳失敗:' + error.message); continue; }
    const { data } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
    urls.push(data.publicUrl);
  }
  return urls;
}

function pathFromPublicUrl(url){
  const marker = '/object/public/' + IMAGE_BUCKET + '/';
  const idx = url.indexOf(marker);
  if(idx === -1) return null;
  return url.slice(idx + marker.length);
}

async function deleteImagesFromStorage(urls){
  const paths = urls.map(pathFromPublicUrl).filter(Boolean);
  if(paths.length === 0) return;
  const { data, error } = await sb.storage.from(IMAGE_BUCKET).remove(paths);
  if(error){
    alert('刪除圖片失敗(權限或網路問題):' + error.message);
    console.error('刪除圖片失敗:', error, '嘗試刪除的路徑:', paths);
    return;
  }
  if(!data || data.length < paths.length){
    console.warn('部分圖片可能沒有真的被刪除,預期 '+paths.length+' 筆,實際回報 '+(data?data.length:0)+' 筆。', paths, data);
  }
}

async function deleteTradeRemote(tradeId, images){
  if(images && images.length) await deleteImagesFromStorage(images);
  const { error } = await sb.from('trades').delete().eq('id', tradeId);
  if(error){ alert('刪除交易失敗:' + error.message); return false; }
  return true;
}

async function saveTradeRemote(accountId, draft, tradeId){
  const row = {
    account_id: accountId,
    pair: draft.pair, direction: draft.direction,
    entry: draft.entry === '' ? null : Number(draft.entry),
    exit: draft.exit === '' ? null : Number(draft.exit),
    lots: draft.lots === '' ? null : Number(draft.lots),
    pnl: draft.pnl === '' ? null : Number(draft.pnl),
    storage_fee: draft.storageFee === '' ? null : Number(draft.storageFee),
    risk_percent: draft.riskPercent === '' ? null : Number(draft.riskPercent),
    open_time: draft.openTime || null,
    platform_time: draft.platformTime,
    note: draft.note || null,
    images: draft.images
  };
  if(tradeId){
    const { data, error } = await sb.from('trades').update(row).eq('id', tradeId).select().single();
    if(error){ alert('更新交易失敗:' + error.message); return null; }
    return data;
  } else {
    const { data, error } = await sb.from('trades').insert(row).select().single();
    if(error){ alert('新增交易失敗:' + error.message); return null; }
    return data;
  }
}

async function bulkUpdateRiskPercent(updates){
  // updates: [{ id, riskPercent }]
  for(const u of updates){
    const { error } = await sb.from('trades').update({ risk_percent: u.riskPercent }).eq('id', u.id);
    if(error){ console.error('更新風控失敗(id='+u.id+'):', error.message); }

}

async function insertTradesBatchRemote(accountId, drafts){
  const rows = drafts.map(r => ({
    account_id: accountId, pair: r.pair, direction: r.direction,
    entry: r.entry === '' ? null : Number(r.entry),
    exit: r.exit === '' ? null : Number(r.exit),
    lots: r.lots === '' ? null : Number(r.lots),
    pnl: r.pnl === '' ? null : Number(r.pnl),
    storage_fee: null, risk_percent: null,
    open_time: r.openTime || null,

  }));
  const { data, error } = await sb.from('trades').insert(rows).select();

}

function renderCalendar(acc){
  const wrap = document.getElementById('calendarView');
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth(); // 0-based

  // 依日期分組:當天筆數、當天總損益(跟卡片顯示邏輯一致)
  const dayMap = new Map(); // key: 'YYYY-MM-DD' -> { count, total }
  acc.trades.forEach(t=>{
    const d = parsePlatformDate(t.platformTime);
    if(!d) return;
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const entry = dayMap.get(key) || { count:0, total:0 };
    entry.count += 1;
    entry.total += totalPnlOf(t);
    dayMap.set(key, entry);
  });

  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay(); // 0=週日
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = year + '年' + (month+1) + '月';

  // 本月總損益
  let monthTotal = 0;
  dayMap.forEach((info, key) => {
    if(key.startsWith(year+'-'+String(month+1).padStart(2,'0'))) monthTotal += info.total;
  });

  const weekdayNames = ['週日','週一','週二','週三','週四','週五','週六'];
  let cellsHtml = '';
  for(let i=0;i<startWeekday;i++){
    cellsHtml += '<div class="cal-cell cal-cell-empty"></div>';
  }
  for(let day=1; day<=daysInMonth; day++){
    const key = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const info = dayMap.get(key);
    let bg = '#fcfcfb', color = '#0b0b0b', border = '#e1e0d9';
    let bodyHtml = '';
    if(info){
      if(info.total > 0){ bg = '#e6f4ea'; color = '#0a7a2e'; border = '#bfe3c9'; }
      else if(info.total < 0){ bg = '#fbe4e2'; color = '#a02c22'; border = '#f0c9c8'; }
      bodyHtml = '<div style="font-size:10px;margin-top:3px;">'+info.count+' 筆</div>'
        + '<div style="font-size:11px;font-weight:700;white-space:nowrap;">'+fmtMoney(info.total)+'</div>';
    }
    const isInRange = selectedDateStart && selectedDateEnd && key >= selectedDateStart && key <= selectedDateEnd;
    const ring = isInRange ? 'box-shadow:0 0 0 2px #0b0b0b inset;' : '';
    cellsHtml += '<div class="cal-cell" data-date="'+key+'" style="background:'+bg+';color:'+color+';border-color:'+border+';cursor:pointer;'+ring+'">'
      + '<div style="font-size:11px;color:#898781;">'+day+'</div>' + bodyHtml
      + '</div>';
  }

  wrap.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <button id="calPrevBtn" style="padding:6px 10px;">‹</button>
      <div style="font-size:14px;font-weight:600;">${monthLabel}</div>
      <button id="calNextBtn" style="padding:6px 10px;">›</button>
    </div>
    <div style="text-align:center;font-size:12px;color:#52514e;margin-bottom:10px;white-space:nowrap;">本月損益 ${fmtMoney(monthTotal)}</div>
    <div class="cal-grid cal-grid-header">
      ${weekdayNames.map(w=>'<div class="cal-weekday">'+w+'</div>').join('')}
    </div>
    <div id="calGridBody" class="cal-grid">${cellsHtml}</div>
  `;

function buildEquitySeries(acc){
  const sorted = acc.trades.map(t => ({ ...t, _d: parsePlatformDate(t.platformTime) })).filter(t => t._d).sort((a,b)=> a._d - b._d);
  if(sorted.length===0){
    return { labels:['起始'], data:[acc.initialCapital], granularity:'day' };
  }
  const first = sorted[0]._d;
  const last = sorted[sorted.length-1]._d;
  const spanDays = (last - first) / 86400000;
  let granularity = 'day';
  if(spanDays > 730) granularity = 'year';
  else if(spanDays > 60) granularity = 'month';
  function bucketKey(d){
    if(granularity==='year') return String(d.getFullYear());
    if(granularity==='month') return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  let running = acc.initialCapital;
  const buckets = new Map();
  sorted.forEach(t=>{
    running += totalPnlOf(t);
    buckets.set(bucketKey(t._d), Math.round(running*100)/100);
  });
  const labels = ['起始', ...buckets.keys()];
  const data = [acc.initialCapital, ...buckets.values()];
  return { labels, data, granularity };
}

async function compressImage(file){
  try {
    const bitmap = await createImageBitmap(file);
    const maxDim = 1600;
    let width = bitmap.width, height = bitmap.height;
    if(width > maxDim || height > maxDim){
      const scale = Math.min(maxDim / width, maxDim / height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, width, height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.75));
    if(!blob) return file;
    const baseName = (file.name ? file.name.replace(/\.[^.]+$/, '') : 'image');
    return new File([blob], baseName + '.jpg', { type: 'image/jpeg' });
  } catch(e){
    console.error('圖片壓縮失敗,改用原圖上傳:', e);
    return file;
  }
}

async function addDraftFile(file){

function updateRiskArea(){
  const acc = accounts.find(a=>a.id===activeId);
  if(!acc) return;
  const pnl = Number(document.getElementById('tPnl').value)||0;
  const sf = Number(document.getElementById('tStorage').value)||0;

  const timeVal = document.getElementById('tTime').value;
  const autoWrap = document.getElementById('riskAuto');
  const manualWrap = document.getElementById('riskManual');
  if(net < 0){
    const before = balanceBeforeTrade(acc, editingTradeId, timeVal);

    autoWrap.style.display = 'block';
    manualWrap.style.display = 'none';
    autoWrap.querySelector('span').textContent = '風控 ' + riskPct.toFixed(2) + '%(純交易損益虧損 ' + fmtMoney(Math.abs(net)) + ' ÷ 下單前資金 ' + fmtMoney(before) + ',已扣除庫存費)';
    document.getElementById('tRiskManual').dataset.autoValue = riskPct.toFixed(2);

    document.getElementById('pieView').style.display = activeView==='pie' ? 'block' : 'none';
    [[viewChartBtn,'chart'],[viewCalBtn,'calendar'],[viewPieBtn,'pie']].forEach(([btn,key])=>{
      btn.style.background = activeView===key ? '#fff' : 'transparent';
      btn.style.fontWeight = activeView===key ? '600' : '400';
    });
    if(activeView==='calendar') renderCalendar(acc);
    if(activeView==='pie') renderPieChart(acc);
  }
  viewChartBtn.onclick = () => { activeView='chart'; applyView(); };
  viewCalBtn.onclick = () => { activeView='calendar'; applyView(); };
  viewPieBtn.onclick = () => { activeView='pie'; applyView(); };
  applyView();

  const filterDateStartInput = document.getElementById('filterDateStart');
  const filterDateEndInput = document.getElementById('filterDateEnd');
  if(filterDateStartInput){
    filterDateStartInput.onchange = () => {
      selectedDateStart = filterDateStartInput.value || null;
      if(selectedDateStart && selectedDateEnd && selectedDateStart > selectedDateEnd) selectedDateEnd = selectedDateStart;
      render();
    };
  }
  if(filterDateEndInput){
    filterDateEndInput.onchange = () => {
      selectedDateEnd = filterDateEndInput.value || null;
      if(selectedDateStart && selectedDateEnd && selectedDateEnd < selectedDateStart) selectedDateStart = selectedDateEnd;
      render();
    };
  }

  document.getElementById('newTradeBtn').onclick = () => { openTradeForm(null); };
  document.getElementById('cancelTrade').onclick = () => { document.getElementById('tradeForm').style.display='none'; editingTradeId=null; };
  document.getElementById('batchBtn').onclick = () => { openBatchForm(); };
  document.getElementById('cancelBatch').onclick = () => { document.getElementById('batchForm').style.display='none'; };
  document.getElementById('parseBatchBtn').onclick = () => {
    parsedBatch = parseBatchText(document.getElementById('batchText').value);
    renderBatchPreview();
  };
  document.getElementById('confirmBatch').onclick = async () => {
    const toAdd = parsedBatch.filter(r=>r.include);
    if(toAdd.length===0){ document.getElementById('batchForm').style.display = 'none'; return; }
    const btn = document.getElementById('confirmBatch');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>匯入中';
    const inserted = await insertTradesBatchRemote(acc.id, toAdd);
    inserted.forEach(t=>{
      acc.trades.unshift({
        id: t.id, pair: t.pair, direction: t.direction, entry: t.entry, exit: t.exit,
        lots: t.lots, pnl: t.pnl, storageFee: t.storage_fee, riskPercent: t.risk_percent,
        openTime: t.open_time, platformTime: t.platform_time, note: t.note, images: t.images || []
      });
      if(t.pair && !pairList.includes(t.pair)) pairList.push(t.pair);
    });
    btn.disabled = false; btn.textContent = '全部加入';
    document.getElementById('batchForm').style.display = 'none';
    render();
  };

  const pairInput = document.getElementById('tPairInput');
  pairInput.oninput = (e) => { selectedPair = e.target.value.toUpperCase(); renderPairOptions(e.target.value); };
  pairInput.onfocus = (e) => { renderPairOptions(e.target.value); };
  document.addEventListener('click', (e)=>{
    if(!pairInput.contains(e.target) && !document.getElementById('pairOptions').contains(e.target)){
      document.getElementById('pairOptions').classList.remove('show');
    }
    const accMenu = document.getElementById('accMenu');
    if(accMenu && !accMenu.contains(e.target) && e.target.id !== 'menuBtn'){
      accMenu.classList.remove('show');
    }
  });

  ['tDir','tEntry','tExit','tPnl','tTime'].forEach(id=>{
    document.getElementById(id).addEventListener('input', updateWarning);
    document.getElementById(id).addEventListener('change', updateWarning);
  });
  document.getElementById('tStorage').addEventListener('input', () => { updateTotalPreview(); updateRiskArea(); });

  document.getElementById('tImages').onchange = (e) => {
    const files = Array.from(e.target.files || []);
    files.forEach(f => addDraftFile(f));
    e.target.value = '';
  };
  function handlePasteEvent(e){
    const items = (e.clipboardData && e.clipboardData.items) || [];
    let found = false;
    for(const item of items){
      if(item.type && item.type.startsWith('image/')){
        found = true;
        const file = item.getAsFile();
        addDraftFile(file);
      }
    }
    if(found) e.preventDefault();
  }
  const pasteZone = document.getElementById('pasteZone');
  pasteZone.addEventListener('paste', handlePasteEvent);
  pasteZone.addEventListener('click', () => pasteZone.focus());

  document.getElementById('saveTrade').onclick = async () => {
    let pairVal = document.getElementById('tPairInput').value.trim().toUpperCase();
    if(pairVal && !pairList.includes(pairVal)) pairList.push(pairVal);
    const pnl = Number(document.getElementById('tPnl').value)||0;
    const sf = Number(document.getElementById('tStorage').value)||0;
    const net = pnl - sf;
    let riskPercent;
    if(net < 0){ riskPercent = document.getElementById('tRiskManual').dataset.autoValue || ''; }
    else { riskPercent = document.getElementById('tRiskManual').value; }

    const btn = document.getElementById('saveTrade');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>儲存中';

    // 上傳新圖片,保留已存在的網址
    const existingUrls = draftImages.filter(d=>d.url).map(d=>d.url);
    const newFiles = draftImages.filter(d=>d.file).map(d=>d.file);
    const uploadedUrls = newFiles.length ? await uploadImages(newFiles) : [];
    const allImages = [...existingUrls, ...uploadedUrls];

    const draft = {
      pair: pairVal, direction: document.getElementById('tDir').value,
      entry: document.getElementById('tEntry').value, exit: document.getElementById('tExit').value,
      lots: document.getElementById('tLots').value, pnl: document.getElementById('tPnl').value,
      storageFee: document.getElementById('tStorage').value, riskPercent: riskPercent,
      openTime: document.getElementById('tOpenTime').value,
      platformTime: document.getElementById('tTime').value,
      note: document.getElementById('tNote').value,
      images: allImages,
    };
    const saved = await saveTradeRemote(acc.id, draft, editingTradeId);
    btn.disabled = false; btn.textContent = '儲存';
    if(!saved) return;

    const normalized = {
      id: saved.id, pair: saved.pair, direction: saved.direction, entry: saved.entry, exit: saved.exit,
      lots: saved.lots, pnl: saved.pnl, storageFee: saved.storage_fee, riskPercent: saved.risk_percent,
      openTime: saved.open_time, platformTime: saved.platform_time, note: saved.note, images: saved.images || []
    };
    if(editingTradeId){
      const idx = acc.trades.findIndex(t=>t.id===editingTradeId);
      if(idx>-1) acc.trades[idx] = normalized;
    } else {
      acc.trades.unshift(normalized);
    }
    document.getElementById('tradeForm').style.display='none';
    editingTradeId = null;
    render();
  };

  const clearFilterBtn = document.getElementById('clearDateFilterBtn');
  if(clearFilterBtn){ clearFilterBtn.onclick = () => { selectedDateStart = null; selectedDateEnd = null; pieFilterPair = null; render(); }; }

  const list = document.getElementById('tradeList');
  const dateFiltered = acc.trades.filter(t=>{
    if(selectedDateStart || selectedDateEnd){
      const d = parsePlatformDate(t.platformTime);
      if(!d) return false;
      const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(selectedDateStart && key < selectedDateStart) return false;
      if(selectedDateEnd && key > selectedDateEnd) return false;
    }
    if(pieFilterPair && t.pair !== pieFilterPair) return false;
    return true;
  });
  const sortedDesc = [...dateFiltered].sort((a,b)=>(b.platformTime||'').localeCompare(a.platformTime||''));
  if(sortedDesc.length===0){
    list.innerHTML = '<div class="empty-state" style="color:#898781;font-size:13px;">'+((selectedDateStart||pieFilterPair) ? '符合篩選條件的交易紀錄是空的' : '還沒有交易紀錄')+'</div>';
  } else {
    let html = '';
    sortedDesc.forEach(t=>{
      const net = netTradingPnl(t);
      const warn = checkLogicWarning(t.direction, t.entry, t.exit, net);
      const hasFee = t.storageFee !== undefined && t.storageFee !== null && t.storageFee !== '';
      const total = totalPnlOf(t);
      const imgsHtml = (t.images && t.images.length) ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">'+t.images.map((src,ii)=>'<img src="'+src+'" class="thumb tradeImg" data-tid="'+t.id+'" data-idx="'+ii+'" />').join('')+'</div>' : '';
      const warnHtml = warn ? '<div style="display:flex;align-items:flex-start;gap:6px;background:#faeeda;border-radius:6px;padding:6px 8px;margin-top:8px;"><span style="font-size:11px;color:#854f0b;line-height:1.5;">⚠ '+warn+'</span></div>' : '';

      // 風控:即時運算,不用點編輯、不用按鈕。沒填庫存費先當 0 算;
      // 之後你哪天補上庫存費並儲存,這裡會自動用新的庫存費重新算出正確數字。
      let riskHtml = '';
      if(net < 0){
        const before = balanceBeforeTrade(acc, t.id, t.platformTime);
        const riskPct = before > 0 ? (Math.abs(net) / before) * 100 : 0;
        riskHtml = '<div style="font-size:11px;color:#52514e;margin-top:4px;">風控 '+riskPct.toFixed(2)+'%(自動計算'+(hasFee ? '' : ',尚未填庫存費,暫以 0 計算')+')</div>';
      } else if(t.riskPercent !== undefined && t.riskPercent !== null && t.riskPercent !== ''){
        riskHtml = '<div style="font-size:11px;color:#52514e;margin-top:4px;">風控 '+Number(t.riskPercent).toFixed(2)+'%(手動輸入)</div>';
      }

      const holding = formatHoldingDuration(t.openTime, t.platformTime);
      const openTw = t.openTime ? taiwanTime(t.openTime) : '';
      html += '<div class="trade-card">'
        + (openTw ? '<div style="font-size:11px;color:#898781;margin-bottom:4px;">開倉 '+openTw+'</div>' : '')
        + '<div style="display:flex;justify-content:space-between;align-items:baseline;">'
        + '<div style="font-size:14px;font-weight:600;">'+(t.pair||'—')+' <span style="color:'+(t.direction==='buy'?'#008300':'#e34948')+';font-size:12px;">'+t.direction+' '+t.lots+'</span></div>'
        + '<div style="font-size:14px;font-weight:600;white-space:nowrap;color:'+(total>=0?'#008300':'#e34948')+';">'+fmtMoney(total)+'</div>'
        + '</div>'
        + '<div style="font-size:12px;color:#52514e;margin-top:4px;">'+t.entry+' → '+t.exit+'</div>'
        + (hasFee ? '<div style="font-size:11px;color:#898781;margin-top:4px;">損益已含庫存費 '+fmtMoney(t.storageFee)+'(純交易損益 '+fmtMoney(net)+')</div>' : '')
        + riskHtml
        + '<div style="font-size:11px;color:#898781;margin-top:4px;">平倉 '+(taiwanTime(t.platformTime)||'—')+(holding ? ' · 持倉 '+holding : '')+'</div>'
        + warnHtml + imgsHtml
        + '<div style="margin-top:8px;display:flex;gap:8px;"><button class="editBtn" data-id="'+t.id+'" style="padding:4px 10px;font-size:12px;">編輯</button><button class="diaryBtn" data-id="'+t.id+'" style="padding:4px 10px;font-size:12px;">日記</button><button class="deleteTradeBtn" data-id="'+t.id+'" style="padding:4px 10px;font-size:12px;color:#e34948;border-color:#f0c9c8;">刪除</button></div>'
        + '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('.editBtn').forEach(btn=>{
      btn.onclick = () => { const tr = acc.trades.find(x=>x.id===btn.dataset.id); if(tr) openTradeForm(tr); };
    });
    list.querySelectorAll('.diaryBtn').forEach(btn=>{
      btn.onclick = () => {
        const tr = acc.trades.find(x=>x.id===btn.dataset.id);
        if(!tr) return;
        const key = dateKeyOf(tr.platformTime);
        if(!key){ alert('這筆交易沒有有效的平倉時間,無法對應到日期。'); return; }
        openDiaryScreen(key, tr.id);
      };
    });
    list.querySelectorAll('.deleteTradeBtn').forEach(btn=>{
      btn.onclick = async () => {
        const tr = acc.trades.find(x=>x.id===btn.dataset.id);
        if(!tr) return;
        const confirmed = confirm('確定要刪除這筆「'+(tr.pair||'')+'」交易紀錄嗎?附加的截圖也會一併刪除,此動作無法復原。');
        if(!confirmed) return;
        btn.disabled = true;
        const ok = await deleteTradeRemote(tr.id, tr.images);
        if(!ok) { btn.disabled = false; return; }
        acc.trades = acc.trades.filter(x=>x.id!==tr.id);
        render();
      };
    });
    list.querySelectorAll('.tradeImg').forEach(img=>{
      img.onclick = () => {
        const tr = acc.trades.find(x=>x.id===img.dataset.tid);
        if(tr) openLightbox(tr.images, Number(img.dataset.idx));
      };
    });
  }
}

function renderPieChart(acc){
  // 商品分布圓餅圖:反映目前的日期篩選(若有),但不受商品篩選本身影響,這樣才能點選切換
  const pieSourceTrades = acc.trades.filter(t=>{
    if(!selectedDateStart && !selectedDateEnd) return true;
    const d = parsePlatformDate(t.platformTime);
    if(!d) return false;
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(selectedDateStart && key < selectedDateStart) return false;
    if(selectedDateEnd && key > selectedDateEnd) return false;
    return true;
  });
  const pairCounts = new Map();
  pieSourceTrades.forEach(t=>{
    const p = t.pair || '未標示';
    pairCounts.set(p, (pairCounts.get(p)||0) + 1);
  });
  const pieLabels = [...pairCounts.keys()];
  const pieData = [...pairCounts.values()];
  const pieColors = ['#2a78d6','#e08a3c','#5fa85f','#c8577a','#8b6bd6','#3fa9b0','#d6a72a','#9c6b4f','#6b7fd6','#b0555e'];

  const pieCtx = document.getElementById('pieChart');
  if(pieChart) pieChart.destroy();
  if(pieLabels.length === 0){
    pieCtx.parentElement.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#898781;font-size:13px;">還沒有交易紀錄可以統計</div>';
    return;
  }
  const pieTotal = pieData.reduce((s,n)=>s+n,0);
  pieChart = new Chart(pieCtx, {
    type:'pie',
    data:{ labels: pieLabels, datasets:[{ data: pieData, backgroundColor: pieLabels.map((_,i)=>pieColors[i % pieColors.length]) }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      // 只有點下方圖例文字才會篩選,圓餅圖本身只用來看(手指點/移過去只顯示提示框百分比),
      // 避免手機點圓餅圖時因為觸控同時觸發篩選、畫面整個重刷,看不到提示框內容。
      plugins:{
        legend:{
          position:'bottom',
          labels:{
            font:{size:11}, boxWidth:12,
            generateLabels:(chart)=>{
              const defaults = Chart.overrides.pie.plugins.legend.labels.generateLabels(chart);
              defaults.forEach((item,i)=>{
                const pct = pieTotal>0 ? (pieData[i]/pieTotal*100).toFixed(1) : '0.0';
                item.text = pieLabels[i] + ' ' + pct + '%';
              });
              return defaults;
            }
          },
          onClick:(evt, legendItem)=>{
            const idx = legendItem.index;
            const clickedPair = pieLabels[idx];
            pieFilterPair = (pieFilterPair === clickedPair) ? null : clickedPair;
            render();
          }
        },
        tooltip:{
          callbacks:{
            label:(ctx)=>{
              const pct = pieTotal>0 ? (ctx.parsed/pieTotal*100).toFixed(1) : '0.0';
              return ctx.label + ': ' + ctx.parsed + ' 筆 (' + pct + '%)';
            }
          }
        }
      }
    }
  });
}

let diaryPendingUploads = 0;

function openDiaryScreen(dateKey, preferredTradeId){
  const acc = accounts.find(a=>a.id===activeId);
  if(!acc) return;
  diaryCurrentDate = dateKey;
  diaryDayTrades = acc.trades.filter(t => dateKeyOf(t.platformTime) === dateKey)
    .sort((a,b)=>(a.platformTime||'').localeCompare(b.platformTime||''));
  if(preferredTradeId && diaryDayTrades.find(t=>t.id===preferredTradeId)){
    diarySelectedTradeId = preferredTradeId;
  } else {
    diarySelectedTradeId = diaryDayTrades.length ? diaryDayTrades[0].id : null;
  }
  diaryDirty = false;
  document.getElementById('diaryDateLabel').textContent = dateKey + ' 日記';
  renderDiarySidebar();
  renderDiaryMain();
  document.getElementById('diaryScreen').style.display = 'block';
  closeDiarySidebar();

function closeDiaryScreen(){
  if(diaryDirty){
    const ok = confirm('這筆日記有還沒儲存的修改,確定要離開嗎?離開就不會存檔。');
    if(!ok) return;

  document.getElementById('diaryScreen').style.display = 'none';
}

function switchDiaryTrade(tradeId){
  if(diaryDirty){
    const ok = confirm('這筆日記有還沒儲存的修改,確定要切換到別筆嗎?目前的修改不會存檔。');

function closeDiarySidebar(){

function renderDiarySidebar(){
  const wrap = document.getElementById('diarySidebar');

    return '<div class="diary-side-item" data-id="'+t.id+'" style="padding:8px;border-radius:8px;margin-bottom:6px;cursor:pointer;background:'+(active?'#efeee9':'transparent')+';border:1px solid '+(active?'#c3c2b7':'transparent')+';">'

    el.onclick = () => { switchDiaryTrade(el.dataset.id); };
  });

async function insertImageIntoNote(file){
  const editable = document.getElementById('diaryNoteInput');
  const tempUrl = URL.createObjectURL(file);
  const img = document.createElement('img');
  img.src = tempUrl;
  img.style.opacity = '0.5';
  const sel = window.getSelection();
  if(sel && sel.rangeCount > 0 && editable.contains(sel.anchorNode)){
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(img);
    range.setStartAfter(img);
    range.setEndAfter(img);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    editable.appendChild(img);
  }
  editable.focus();
  diaryDirty = true;

  diaryPendingUploads++;
  try {
    const urls = await uploadImages([file]);
    if(urls && urls[0]){
      img.src = urls[0];
      img.style.opacity = '1';
    } else {
      img.remove();
    }
  } finally {
    diaryPendingUploads--;
    URL.revokeObjectURL(tempUrl);
  }
}

function addDiaryDraftFile(file){
  insertImageIntoNote(file);
}

  ['diaryPair','diaryDir','diaryEntry','diaryExit','diaryLots','diaryPnl','diaryOpenTime','diaryCloseTime'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input', ()=>{ diaryDirty = true; });
    el.addEventListener('change', ()=>{ diaryDirty = true; });
  });
  noteInput.addEventListener('input', ()=>{ diaryDirty = true; });
  diaryDirty = false;
}

async function saveDiaryTrade(){
  if(diaryPendingUploads > 0){
    alert('圖片還在上傳中,請稍等一下再儲存。');
    return;
  }
  const acc = accounts.find(a=>a.id===activeId);
  if(!acc) return;
  const trade = acc.trades.find(t=>t.id===diarySelectedTradeId);
  if(!trade) return;

  const btn = document.getElementById('diarySaveBtn');
  const originalText = btn.textContent;
  const originalBg = btn.style.background;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>儲存中';

  let pairVal = document.getElementById('diaryPair').value.trim().toUpperCase();
  if(pairVal && !pairList.includes(pairVal)) pairList.push(pairVal);

  const noteEl = document.getElementById('diaryNoteInput');
  const newImages = Array.from(noteEl.querySelectorAll('img')).map(img=>img.src);
  const oldImages = trade.images || [];
  const removedImages = oldImages.filter(u => !newImages.includes(u));
  if(removedImages.length) await deleteImagesFromStorage(removedImages);

  const draft = {
    pair: pairVal,
    direction: document.getElementById('diaryDir').value,
    entry: document.getElementById('diaryEntry').value,
    exit: document.getElementById('diaryExit').value,
    lots: document.getElementById('diaryLots').value,
    pnl: document.getElementById('diaryPnl').value,
    storageFee: trade.storageFee !== undefined && trade.storageFee !== null ? trade.storageFee : '',
    riskPercent: trade.riskPercent !== undefined && trade.riskPercent !== null ? trade.riskPercent : '',
    openTime: document.getElementById('diaryOpenTime').value,
    platformTime: document.getElementById('diaryCloseTime').value,
    note: noteEl.innerHTML,
    images: newImages,
  };
  const saved = await saveTradeRemote(acc.id, draft, trade.id);
  btn.disabled = false;
  if(!saved){
    btn.textContent = originalText;
    btn.style.background = originalBg;
    return;
  }

  const normalized = {
    id: saved.id, pair: saved.pair, direction: saved.direction, entry: saved.entry, exit: saved.exit,
    lots: saved.lots, pnl: saved.pnl, storageFee: saved.storage_fee, riskPercent: saved.risk_percent,
    openTime: saved.open_time, platformTime: saved.platform_time, note: saved.note, images: saved.images || []
  };
  const idx = acc.trades.findIndex(t=>t.id===trade.id);
  if(idx>-1) acc.trades[idx] = normalized;

  diaryDayTrades = acc.trades.filter(t => dateKeyOf(t.platformTime) === diaryCurrentDate)
    .sort((a,b)=>(a.platformTime||'').localeCompare(b.platformTime||''));
  if(!diaryDayTrades.find(t=>t.id===diarySelectedTradeId)){
    diarySelectedTradeId = diaryDayTrades.length ? diaryDayTrades[0].id : null;
  }
  diaryDirty = false;
  renderDiarySidebar();
  renderDiaryMain();
  render();

  btn.textContent = '✓ 已儲存';
  btn.style.background = '#0a7a2e';
  btn.disabled = true;
  setTimeout(()=>{
    btn.textContent = originalText;
    btn.style.background = originalBg;
    btn.disabled = false;
  }, 1400);
}

function tryExtractImageFromPaste(e){
  const dt = e.clipboardData;
  let found = false;
  if(dt && dt.items){
    for(const item of dt.items){
      if(item.type && item.type.startsWith('image/')){
        found = true;
        const file = item.getAsFile();
        if(file) addDiaryDraftFile(file);
      }
    }
  }
  if(!found && dt && dt.files && dt.files.length){
    for(const file of dt.files){
      if(file.type && file.type.startsWith('image/')){
        found = true;
        addDiaryDraftFile(file);
      }
    }
  }
  return found;
}

document.getElementById('diaryCloseBtn').onclick = closeDiaryScreen;
document.getElementById('diarySaveBtn').onclick = saveDiaryTrade;
document.getElementById('diarySidebarToggle').onclick = openDiarySidebar;
document.getElementById('diarySidebarOverlay').onclick = closeDiarySidebar;
document.getElementById('diaryImages').onchange = (e) => {
  const files = Array.from(e.target.files || []);
  files.forEach(f => addDiaryDraftFile(f));
  e.target.value = '';
};
(function(){
  const noteInput = document.getElementById('diaryNoteInput');
  noteInput.addEventListener('paste', (e)=>{
    const wasImage = tryExtractImageFromPaste(e);
    if(wasImage){
      e.preventDefault();
      return;
    }
    const text = (e.clipboardData && e.clipboardData.getData('text/plain')) || '';
    if(text){
      e.preventDefault();
      document.execCommand('insertText', false, text);
    }
  });
  noteInput.addEventListener('click', (e)=>{
    if(e.target.tagName === 'IMG'){
      const imgs = Array.from(noteInput.querySelectorAll('img'));
      const idx = imgs.indexOf(e.target);
      openLightbox(imgs.map(img=>img.src), idx);
    }
  });
})();
</script>
